name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: yarn
          corepack: true

      - name: Install dependencies
        run: yarn install --immutable

      - name: License headers
        run: yarn license:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: yarn
          corepack: true

      - name: Verify Yarn version
        run: yarn --version

      - name: Install dependencies
        run: yarn workspaces focus @softdmx/tests @softdmx/wasm

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build WASM on the fly
        run: yarn build:wasm

      - name: Run tests with coverage
        run: yarn workspace @softdmx/tests test:coverage

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Rebuild WASM
        working-directory: packages/wasm
        run: |
          mkdir -p dist
          zig build-exe src/main.zig -target wasm32-freestanding -rdynamic -O ReleaseFast --name softdmx
          mv softdmx.wasm dist/softdmx.wasm

      - name: Upload softdmx.wasm
        uses: actions/upload-artifact@v4
        with:
          name: softdmx-wasm
          path: packages/wasm/dist/softdmx.wasm
          if-no-files-found: error
          retention-days: 14

  spa-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: yarn
          corepack: true

      - name: Install dependencies
        run: yarn workspaces focus @softdmx/frontend

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build SPA
        run: yarn build:frontend

  electron-build:
    runs-on: macos-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: yarn
          corepack: true

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Electron (smoke, not releasable)
        run: |
          yarn build
          yarn workspace @softdmx/client dist --dir
